<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Gym Class Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=q7r4s1">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-accent">FIT</span>CENTRAL
            </div>
            <div class="date-time">
                <div id="current-date">Friday, March 27, 2026</div>
                <div id="current-time">09:00 AM</div>
            </div>
        </header>

        <main>
            <h1>TODAY'S CLASSES</h1>
            <div id="schedule-container" class="schedule-container">
                <!-- Classes will be injected by script.js -->
                <div class="loading">Loading schedule...</div>
            </div>
        </main>

        <footer>
            <div class="footer-message">Next class starting soon! Check-in at the front desk.</div>
        </footer>
    </div>
    <script src="script.js?v=q7r4s1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
